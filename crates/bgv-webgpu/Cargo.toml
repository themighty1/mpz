[package]
name = "bgv-webgpu"
version = "0.1.0"
edition = "2021"
description = "WebGPU-accelerated BGV ciphertext scalar multiplication"
license = "MIT OR Apache-2.0"

[dependencies]
wgpu = { version = "23", features = ["wgsl"] }
naga_oil = "0.20"
naga = "27"
bytemuck = { workspace = true }
pollster = { workspace = true }
thiserror = { workspace = true }
flume = "0.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
futures = { workspace = true }

[dev-dependencies]
rand = { workspace = true }
criterion = { workspace = true }
mpz-justvengers-core = { path = "../justvengers-core" }
mpz-core = { path = "../core" }
mpz-fields = { path = "../fields" }

[[bench]]
name = "gpu_bench"
harness = false
