[package]
name = "mpz-misc-benches"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rand = { workspace = true }
futures = { workspace = true }
rayon = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
getrandom = { version = "0.3", features = ["wasm_js"] }
web-spawn = { version = "0.2", features = ["no-bundler"] }
web-sys = { version = "0.3", features = ["console", "Window", "Performance"] }
aes-wasm = "0.1"
aes = { workspace = true }
mpz-fields = { workspace = true }
ghash_rc = { workspace = true }
# getrandom 0.2 needed by ghash dependencies, requires "js" for wasm
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
chromiumoxide = { version = "0.7", features = ["tokio-runtime"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "net", "io-util"] }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
futures = { workspace = true }
hyper = { version = "1.8", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
mime_guess = "2.0"

[[bin]]
name = "misc-bench-runner"
path = "src/bin/runner.rs"
required-features = []
