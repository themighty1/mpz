[package]
name = "mpz-wasm-bench"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mpz-garble-core = { workspace = true }
mpz-circuits = { workspace = true, features = ["aes"] }
mpz-memory-core = { workspace = true }
mpz-core = { workspace = true }

wasm-bindgen = "0.2"
getrandom = { version = "0.3", features = ["wasm_js"] }
rand = { workspace = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
chromiumoxide = { version = "0.7", features = ["tokio-runtime"], default-features = false }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "net", "io-util"] }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
futures = { workspace = true }
hyper = { version = "1.8", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
mime_guess = "2.0"

[[bin]]
name = "wasm-bench-runner"
path = "src/bin/runner.rs"
required-features = []
