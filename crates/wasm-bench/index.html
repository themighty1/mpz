<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>mpz-garble-core WASM Benchmarks</title>
    <style>
        body {
            font-family: monospace;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            margin: 0;
        }
        h1 {
            color: #569cd6;
        }
        #status {
            color: #4ec9b0;
            margin-bottom: 10px;
        }
        #output {
            white-space: pre;
            background: #252526;
            padding: 15px;
            border-radius: 4px;
            overflow-x: auto;
        }
        .error {
            color: #f44747;
        }
        .success {
            color: #4ec9b0;
        }
        button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 8px 16px;
            margin: 5px;
            cursor: pointer;
            font-family: monospace;
        }
        button:hover {
            background: #1177bb;
        }
        button:disabled {
            background: #3c3c3c;
            cursor: not-allowed;
        }
        #controls {
            margin-bottom: 15px;
        }
        label {
            margin-right: 15px;
        }
        input[type="number"] {
            width: 60px;
            background: #3c3c3c;
            color: #d4d4d4;
            border: 1px solid #555;
            padding: 4px;
        }
    </style>
</head>
<body>
    <h1>mpz-garble-core WASM Benchmarks</h1>

    <div id="controls">
        <label>Iterations: <input type="number" id="iterations" value="100" min="1"></label>
        <label>Samples: <input type="number" id="samples" value="10" min="1"></label>
        <br><br>
        <button id="runAll" disabled>Run All Benchmarks</button>
        <button id="runGarble" disabled>Garble Only</button>
        <button id="runEvaluate" disabled>Evaluate Only</button>
    </div>

    <div id="status">Loading WASM module...</div>
    <div id="output"></div>

    <script type="module">
        import init, * as wasm from './pkg/mpz_wasm_bench.js';
        import * as bench from './js/bench.js';

        const statusEl = document.getElementById('status');
        const outputEl = document.getElementById('output');
        const runAllBtn = document.getElementById('runAll');
        const runGarbleBtn = document.getElementById('runGarble');
        const runEvaluateBtn = document.getElementById('runEvaluate');
        const iterationsInput = document.getElementById('iterations');
        const samplesInput = document.getElementById('samples');

        function getConfig() {
            return {
                iterations: parseInt(iterationsInput.value) || 100,
                samples: parseInt(samplesInput.value) || 10,
            };
        }

        function setStatus(msg, isError = false) {
            statusEl.textContent = msg;
            statusEl.className = isError ? 'error' : 'success';
        }

        function disableButtons(disabled) {
            runAllBtn.disabled = disabled;
            runGarbleBtn.disabled = disabled;
            runEvaluateBtn.disabled = disabled;
        }

        async function runBenchmarks(type) {
            const config = getConfig();
            disableButtons(true);
            setStatus(`Running ${type} benchmarks (${config.iterations} iterations, ${config.samples} samples)...`);
            outputEl.textContent = '';

            // Use setTimeout to allow UI update before blocking
            await new Promise(r => setTimeout(r, 50));

            try {
                let results;
                if (type === 'all') {
                    results = bench.runAllBenchmarks(config.iterations, config.samples);
                } else if (type === 'garble') {
                    results = { garble: bench.runGarbleBenchmarks(config.iterations, config.samples) };
                } else if (type === 'evaluate') {
                    results = { evaluate: bench.runEvaluateBenchmarks(config.iterations, config.samples) };
                }

                const formatted = bench.formatResults(results);
                outputEl.textContent = formatted;
                setStatus('Benchmarks complete!');

                // Store results for chromiumoxide to retrieve
                window.__benchResults = { results, formatted };
            } catch (e) {
                setStatus(`Error: ${e.message}`, true);
                outputEl.textContent = e.stack || e.toString();
            } finally {
                disableButtons(false);
            }
        }

        // Initialize
        async function main() {
            try {
                setStatus('Initializing WASM...');
                await init();
                bench.init(wasm);
                setStatus('WASM loaded. Ready to run benchmarks.');
                disableButtons(false);

                // Check for auto-run (for chromiumoxide)
                const params = new URLSearchParams(window.location.search);
                if (params.get('autorun') === 'true') {
                    const iterations = parseInt(params.get('iterations')) || 100;
                    const samples = parseInt(params.get('samples')) || 10;
                    iterationsInput.value = iterations;
                    samplesInput.value = samples;
                    await runBenchmarks('all');
                }
            } catch (e) {
                setStatus(`Failed to load WASM: ${e.message}`, true);
                outputEl.textContent = e.stack || e.toString();
                window.__benchError = e.message || e.toString();
            }
        }

        // Global error handler
        window.onerror = (msg, url, line, col, error) => {
            window.__benchError = `${msg} at ${url}:${line}:${col}`;
            setStatus(`Error: ${msg}`, true);
        };

        window.onunhandledrejection = (event) => {
            window.__benchError = event.reason?.message || event.reason?.toString() || 'Unknown promise rejection';
            setStatus(`Error: ${window.__benchError}`, true);
        };

        runAllBtn.addEventListener('click', () => runBenchmarks('all'));
        runGarbleBtn.addEventListener('click', () => runBenchmarks('garble'));
        runEvaluateBtn.addEventListener('click', () => runBenchmarks('evaluate'));

        // Expose for chromiumoxide
        window.runBenchmark = async (config) => {
            const iterations = config?.iterations || 100;
            const samples = config?.samples || 10;
            iterationsInput.value = iterations;
            samplesInput.value = samples;
            await runBenchmarks('all');
            return window.__benchResults;
        };

        main();
    </script>
</body>
</html>
