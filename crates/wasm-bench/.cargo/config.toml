[target.wasm32-unknown-unknown]
rustflags = [
    # NOTE: atomics disabled - not needed for WebGPU (async) and causes Atomics.wait errors on main thread
    "-Ctarget-feature=+bulk-memory,+mutable-globals,+simd128",
    # Removed shared-memory flags (only needed for atomics/threading)
    # "-Clink-arg=--shared-memory",
    # "-Clink-arg=--import-memory",
    # "-Clink-arg=--export=__wasm_init_tls",
    # "-Clink-arg=--export=__tls_size",
    # "-Clink-arg=--export=__tls_align",
    # "-Clink-arg=--export=__tls_base",
    # 4GB max memory
    "-Clink-arg=--max-memory=4294967296",
    "--cfg",
    'getrandom_backend="wasm_js"',
]
