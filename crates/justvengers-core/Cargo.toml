[package]
name = "mpz-justvengers-core"
version = "0.1.0-alpha.1"
edition = "2024"
description = "Core primitives for Justvengers VOLE-based ZK protocol"

[lints]
workspace = true

[features]
default = []
rayon = ["dep:rayon"]

[dependencies]
mpz-core = { workspace = true }
mpz-fields = { workspace = true }

thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
bincode = { workspace = true }
rayon = { workspace = true, optional = true }
rand = { workspace = true }

[dev-dependencies]
rand = { workspace = true }
criterion = { workspace = true }
rstest = { workspace = true }

[[bench]]
name = "rotation_bench"
harness = false

[[bench]]
name = "sum_slots_to_slot_bench"
harness = false

[[bench]]
name = "packing_bench"
harness = false

[[bench]]
name = "packed_eval_bench"
harness = false
