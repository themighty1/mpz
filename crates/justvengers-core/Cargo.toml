[package]
name = "mpz-justvengers-core"
version = "0.1.0-alpha.1"
edition = "2024"
description = "Core primitives for Justvengers VOLE-based ZK protocol"

[lints]
workspace = true

[features]
default = []
rayon = ["dep:rayon"]
cl-scheme = ["dep:class_group", "dep:num-bigint"]

[dependencies]
mpz-core = { workspace = true }
mpz-fields = { workspace = true }

thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
rayon = { workspace = true, optional = true }
rand = { workspace = true }

# Class group cryptography for CL-based homomorphic encryption (optional, not wasm-compatible)
class_group = { path = "/home/default2/Desktop/gh_repos/class-group", optional = true }
num-bigint = { workspace = true, optional = true }

[dev-dependencies]
rand = { workspace = true }
criterion = { workspace = true }
rstest = { workspace = true }

[[bench]]
name = "rotation_bench"
harness = false
