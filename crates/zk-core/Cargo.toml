[package]
name = "mpz-zk-core"
version = "0.1.0-alpha.4"
edition = "2024"

[lints]
workspace = true

[features]
default = []
rayon = ["dep:rayon", "mpz-core/rayon", "blake3/rayon", "itybity/rayon"]
# Use chi worker pool (via JS chi-bridge) instead of rayon for chi computation
chi_pool = []
# Use terms worker pool (via JS terms-bridge) instead of rayon for terms computation
terms_pool = []
# Use async JS worker pools for entire check (no rayon/SharedArrayBuffer)
wasm_workers = ["dep:js-sys", "dep:wasm-bindgen-futures"]

[dependencies]
mpz-core = { workspace = true }
mpz-circuits = { workspace = true }
mpz-memory-core = { workspace = true }
mpz-vm-core = { workspace = true }

thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
blake3 = { workspace = true, features = ["serde"] }
cfg-if = { workspace = true }
rangeset = { workspace = true, features = ["serde"] }
rayon = { workspace = true, optional = true }
itybity = { workspace = true }
zerocopy = { workspace = true }
bytemuck = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
js-sys = { version = "0.3", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }

[dev-dependencies]
mpz-circuits = { workspace = true, features = ["aes"] }
mpz-ot-core = { workspace = true, features = ["test-utils"] }
rand = { workspace = true }
criterion = { workspace = true }
aes = { workspace = true }
rstest = { workspace = true }

[[bench]]
name = "prover"
harness = false

[[bench]]
name = "verifier"
harness = false
