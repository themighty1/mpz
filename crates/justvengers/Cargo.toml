[package]
name = "mpz-justvengers"
version = "0.1.0"
edition = "2024"
description = "Justvengers: VOLE-based ZK for batched disjunctive statements"
license = "MIT OR Apache-2.0"

[dependencies]
mpz-core = { path = "../core" }
mpz-fields = { path = "../fields" }
mpz-justvengers-core = { path = "../justvengers-core" }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
rand = { workspace = true }

[features]
default = ["ntt"]
ntt = []

[dev-dependencies]
rand = { workspace = true }
mpz-core = { path = "../core" }
mpz-fields = { path = "../fields" }
mpz-justvengers-core = { path = "../justvengers-core" }
criterion = { workspace = true }

[[bench]]
name = "e2e_bench"
harness = false

[[bench]]
name = "prover"
harness = false

[[bin]]
name = "prover_profile"
path = "src/bin/prover_profile.rs"
