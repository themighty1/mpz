[package]
name = "mpz-justvengers"
version = "0.1.0"
edition = "2024"
description = "Justvengers: VOLE-based ZK for batched disjunctive statements"
license = "MIT OR Apache-2.0"

[dependencies]
mpz-core = { path = "../core" }
mpz-fields = { path = "../fields" }
mpz-justvengers-core = { path = "../justvengers-core" }
mpz-ot-core = { path = "../ot-core" }
mpz-memory-core = { path = "../memory-core" }
mpz-common = { path = "../common" }
serio = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
bincode = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
futures = { workspace = true }
blake3 = { workspace = true }

# GPU acceleration (now mandatory via default feature)
bgv-webgpu = { path = "../bgv-webgpu", optional = true }

[features]
default = ["gpu"]
gpu = ["dep:bgv-webgpu"]
mersenne = ["mpz-fields/mersenne"]
# rayon removed - GPU is now the only supported path

[dev-dependencies]
rand = { workspace = true }
mpz-core = { path = "../core" }
mpz-fields = { path = "../fields" }
mpz-justvengers-core = { path = "../justvengers-core", features = ["rayon"] }
mpz-common = { path = "../common", features = ["test-utils"] }
criterion = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
rayon = { workspace = true }

[[bench]]
name = "vm_bench"
harness = false

[[bench]]
name = "prover_breakdown_bench"
harness = false

[[bin]]
name = "prover_profile"
path = "src/bin/prover_profile.rs"

[[bin]]
name = "vm_profile"
path = "src/bin/vm_profile.rs"

[[bin]]
name = "verifier_setup"
path = "src/bin/verifier_setup.rs"

[[bin]]
name = "prover_bench"
path = "src/bin/prover_bench.rs"

[[bin]]
name = "prover_bench_m61"
path = "src/bin/prover_bench_m61.rs"
required-features = ["mersenne"]

[[bin]]
name = "verifier_setup_m61"
path = "src/bin/verifier_setup_m61.rs"
required-features = ["mersenne"]
